{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block page_header %}
    <h2>Topic</h2>
{% endblock page_header %}

{% block content %}

<p>Add a new topic:</p>
     <form method="post" action="{% url 'learning_logs:new_topic' %}" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        <div class="mb-3">
        <button type="submit" name="submit" class="btn btn-primary">add topic</button>
        </div>
     </form>
{% endblock %}
